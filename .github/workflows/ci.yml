name: ci

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build:
    name: "lake build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # To match the local environment, use upstream Nix instead of
      # DeterminateSystems.
      - uses: cachix/install-nix-action@v31.11.1
      - run: "nix develop -c lake build"


